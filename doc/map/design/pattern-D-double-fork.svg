<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold">Pattern D — Double Fork (submarine + expedition)</text>

  <!-- START -->
  <circle cx="300" cy="65" r="22" fill="#4CAF50" stroke="#333" stroke-width="2"/>
  <text x="300" y="70" text-anchor="middle" fill="white" font-size="12" font-weight="bold">1</text>
  <text x="300" y="100" text-anchor="middle" font-size="11">START</text>

  <!-- First branch -->
  <line x1="300" y1="87" x2="300" y2="120" stroke="#333" stroke-width="2"/>
  <rect x="195" y="115" width="210" height="20" rx="4" fill="#E3F2FD" stroke="#2196F3"/>
  <text x="300" y="130" text-anchor="middle" font-size="10" fill="#1565C0">branch: capital ≤ 0.3? (sub route)</text>

  <!-- LEFT: sub route -->
  <line x1="300" y1="135" x2="80" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="152" text-anchor="middle" font-size="9" fill="#388E3C">Y</text>

  <circle cx="80" cy="195" r="22" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <text x="80" y="200" text-anchor="middle" fill="white" font-size="12" font-weight="bold">5</text>
  <text x="80" y="230" text-anchor="middle" font-size="11">NORMAL</text>
  <text x="80" y="244" text-anchor="middle" font-size="9" fill="#7B1FA2">(sub route)</text>

  <line x1="80" y1="250" x2="80" y2="285" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="80" cy="305" r="22" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="80" y="310" text-anchor="middle" fill="white" font-size="12" font-weight="bold">6</text>
  <text x="80" y="340" text-anchor="middle" font-size="10">NORMAL</text>
  <text x="80" y="355" text-anchor="middle" font-size="9" fill="#777">(end node)</text>
  <text x="80" y="368" text-anchor="middle" font-size="9" fill="#777">Expedition</text>
  <text x="80" y="381" text-anchor="middle" font-size="9" fill="#777">S→Success</text>
  <text x="80" y="394" text-anchor="middle" font-size="9" fill="#777">A/B→Partial</text>

  <!-- RIGHT: main route -->
  <line x1="300" y1="135" x2="500" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="152" text-anchor="middle" font-size="9" fill="#D32F2F">N</text>

  <circle cx="500" cy="195" r="22" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="500" y="200" text-anchor="middle" fill="white" font-size="12" font-weight="bold">2</text>
  <text x="500" y="230" text-anchor="middle" font-size="11">NORMAL</text>

  <!-- Second branch -->
  <line x1="500" y1="217" x2="500" y2="248" stroke="#333" stroke-width="2"/>
  <rect x="400" y="245" width="200" height="20" rx="4" fill="#E3F2FD" stroke="#2196F3"/>
  <text x="500" y="260" text-anchor="middle" font-size="10" fill="#1565C0">branch: screens ≥ 0.4?</text>

  <!-- LEFT of second: boss -->
  <line x1="500" y1="265" x2="380" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="435" y="278" text-anchor="middle" font-size="9" fill="#388E3C">Y</text>

  <circle cx="380" cy="320" r="22" fill="#F44336" stroke="#333" stroke-width="3"/>
  <text x="380" y="325" text-anchor="middle" fill="white" font-size="12" font-weight="bold">3</text>
  <text x="380" y="355" text-anchor="middle" font-size="10">BOSS (end)</text>
  <text x="380" y="370" text-anchor="middle" font-size="9" fill="#777">Sortie Success</text>

  <!-- RIGHT of second: expedition -->
  <line x1="500" y1="265" x2="560" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="535" y="278" text-anchor="middle" font-size="9" fill="#D32F2F">N</text>

  <circle cx="560" cy="320" r="22" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="560" y="325" text-anchor="middle" fill="white" font-size="12" font-weight="bold">4</text>
  <text x="560" y="355" text-anchor="middle" font-size="10">NORMAL</text>
  <text x="560" y="370" text-anchor="middle" font-size="9" fill="#777">(end node)</text>
  <text x="560" y="383" text-anchor="middle" font-size="9" fill="#777">Expedition</text>
  <text x="560" y="396" text-anchor="middle" font-size="9" fill="#777">S→Success</text>
  <text x="560" y="409" text-anchor="middle" font-size="9" fill="#777">A/B→Partial</text>

  <!-- Legend -->
  <rect x="10" y="10" width="150" height="70" fill="#f9f9f9" stroke="#ccc"/>
  <circle cx="25" cy="25" r="8" fill="#4CAF50"/>
  <text x="40" y="29" font-size="10">START</text>
  <circle cx="25" cy="40" r="8" fill="#FF9800"/>
  <text x="40" y="44" font-size="10">NORMAL</text>
  <circle cx="25" cy="55" r="8" fill="#F44336"/>
  <text x="40" y="59" font-size="10">BOSS</text>
  <circle cx="25" cy="70" r="8" fill="#9C27B0"/>
  <text x="40" y="74" font-size="10">NORMAL (sub)</text>
</svg>
