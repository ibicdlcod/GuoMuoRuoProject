<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" font-family="monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold">Pattern M — Multi-route (star 4)</text>

  <!-- START -->
  <circle cx="340" cy="60" r="20" fill="#4CAF50" stroke="#333" stroke-width="2"/>
  <text x="340" y="65" text-anchor="middle" fill="white" font-size="11" font-weight="bold">1</text>
  <text x="340" y="95" text-anchor="middle" font-size="10">START</text>

  <line x1="340" y1="80" x2="340" y2="118" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NORMAL 2 -->
  <circle cx="340" cy="138" r="20" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="340" y="143" text-anchor="middle" fill="white" font-size="11" font-weight="bold">2</text>
  <text x="340" y="170" text-anchor="middle" font-size="10">NORMAL</text>

  <!-- Branch 1: diverge into 3 parallel routes -->
  <line x1="340" y1="158" x2="340" y2="195" stroke="#333" stroke-width="2"/>
  <rect x="215" y="192" width="250" height="18" rx="4" fill="#E3F2FD" stroke="#2196F3"/>
  <text x="340" y="206" text-anchor="middle" font-size="9" fill="#1565C0">branch: capital ≤ 0.2? (sub) | fleet type?</text>

  <!-- LEFT: sub route -->
  <line x1="340" y1="210" x2="60" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="228" text-anchor="middle" font-size="9" fill="#7B1FA2">sub</text>
  <circle cx="60" cy="268" r="18" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <text x="60" y="273" text-anchor="middle" fill="white" font-size="10" font-weight="bold">6</text>
  <line x1="60" y1="286" x2="60" y2="325" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="60" cy="342" r="18" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <text x="60" y="347" text-anchor="middle" fill="white" font-size="10" font-weight="bold">7</text>
  <text x="60" y="375" text-anchor="middle" font-size="8" fill="#7B1FA2">(sub route)</text>

  <!-- CENTER: surface route -->
  <line x1="340" y1="210" x2="340" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="358" y="235" text-anchor="middle" font-size="9" fill="#E65100">surface</text>
  <circle cx="340" cy="268" r="18" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="340" y="273" text-anchor="middle" fill="white" font-size="10" font-weight="bold">3</text>
  <line x1="340" y1="286" x2="340" y2="325" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="340" cy="342" r="18" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="340" y="347" text-anchor="middle" fill="white" font-size="10" font-weight="bold">4</text>

  <!-- RIGHT: expedition route -->
  <line x1="340" y1="210" x2="620" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="228" text-anchor="middle" font-size="9" fill="#D32F2F">exped</text>
  <circle cx="620" cy="268" r="18" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="620" y="273" text-anchor="middle" fill="white" font-size="10" font-weight="bold">8</text>
  <line x1="620" y1="286" x2="620" y2="325" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="620" cy="342" r="18" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="620" y="347" text-anchor="middle" fill="white" font-size="10" font-weight="bold">9</text>
  <text x="620" y="375" text-anchor="middle" font-size="8" fill="#777">(end)</text>
  <text x="620" y="388" text-anchor="middle" font-size="8" fill="#777">Expedition</text>
  <text x="620" y="401" text-anchor="middle" font-size="8" fill="#777">S→Success</text>
  <text x="620" y="414" text-anchor="middle" font-size="8" fill="#777">A/B→Partial</text>

  <!-- Sub + surface converge -->
  <line x1="60" y1="360" x2="200" y2="430" stroke="#333" stroke-width="1.5"/>
  <line x1="340" y1="360" x2="200" y2="430" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="395" text-anchor="middle" font-size="8" fill="#555">↘ converge ↙</text>

  <rect x="120" y="422" width="160" height="20" rx="4" fill="#E8F5E9" stroke="#4CAF50"/>
  <text x="200" y="437" text-anchor="middle" font-size="9" fill="#2E7D32">shared junction</text>

  <circle cx="200" cy="455" r="20" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="200" y="460" text-anchor="middle" fill="white" font-size="11" font-weight="bold">5</text>

  <line x1="200" y1="475" x2="200" y2="515" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="200" cy="535" r="20" fill="#F44336" stroke="#333" stroke-width="3"/>
  <text x="200" y="540" text-anchor="middle" fill="white" font-size="11" font-weight="bold">BOSS</text>
  <text x="200" y="568" text-anchor="middle" font-size="8" fill="#777">Sortie Success</text>

  <!-- Legend -->
  <rect x="10" y="10" width="155" height="95" fill="#f9f9f9" stroke="#ccc"/>
  <circle cx="25" cy="25" r="8" fill="#4CAF50"/><text x="40" y="29" font-size="10">START</text>
  <circle cx="25" cy="40" r="8" fill="#FF9800"/><text x="40" y="44" font-size="10">NORMAL</text>
  <circle cx="25" cy="55" r="8" fill="#F44336"/><text x="40" y="59" font-size="10">BOSS (end)</text>
  <circle cx="25" cy="70" r="8" fill="#9C27B0"/><text x="40" y="74" font-size="10">NORMAL (sub)</text>
  <rect x="15" y="80" width="20" height="12" rx="2" fill="#E3F2FD" stroke="#2196F3"/>
  <text x="40" y="91" font-size="10">branch</text>
  <rect x="15" y="95" width="20" height="12" rx="2" fill="#E8F5E9" stroke="#4CAF50"/>
  <text x="40" y="106" font-size="10">converge</text>
</svg>
