<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650" font-family="monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold">Pattern S — Staggered (star 5)</text>

  <!-- START -->
  <circle cx="350" cy="58" r="20" fill="#4CAF50" stroke="#333" stroke-width="2"/>
  <text x="350" y="63" text-anchor="middle" fill="white" font-size="11" font-weight="bold">1</text>
  <text x="350" y="92" text-anchor="middle" font-size="10">START</text>

  <line x1="350" y1="78" x2="350" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NORMAL 2 -->
  <circle cx="350" cy="135" r="20" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="350" y="140" text-anchor="middle" fill="white" font-size="11" font-weight="bold">2</text>

  <line x1="350" y1="155" x2="350" y2="190" stroke="#333" stroke-width="2"/>
  <rect x="230" y="187" width="240" height="18" rx="4" fill="#E3F2FD" stroke="#2196F3"/>
  <text x="350" y="201" text-anchor="middle" font-size="9" fill="#1565C0">branch: capital ≤ 0.2? | fleet type?</text>

  <!-- LEFT: sub route (3 battles) -->
  <line x1="350" y1="205" x2="50" y2="245" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="223" text-anchor="middle" font-size="8" fill="#7B1FA2">sub</text>
  <circle cx="50" cy="263" r="17" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <text x="50" y="268" text-anchor="middle" fill="white" font-size="10" font-weight="bold">7</text>
  <line x1="50" y1="280" x2="50" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="50" cy="337" r="17" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <text x="50" y="342" text-anchor="middle" fill="white" font-size="10" font-weight="bold">8</text>
  <line x1="50" y1="354" x2="50" y2="394" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="50" cy="411" r="17" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <text x="50" y="416" text-anchor="middle" fill="white" font-size="10" font-weight="bold">9</text>

  <!-- CENTER: surface/medium route (2 battles + choice) -->
  <line x1="350" y1="205" x2="350" y2="245" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="368" y="230" text-anchor="middle" font-size="8" fill="#E65100">surface</text>
  <circle cx="350" cy="263" r="17" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="350" y="268" text-anchor="middle" fill="white" font-size="10" font-weight="bold">3</text>
  <line x1="350" y1="280" x2="350" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="350" cy="337" r="17" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="350" y="342" text-anchor="middle" fill="white" font-size="10" font-weight="bold">4</text>
  <line x1="350" y1="354" x2="350" y2="385" stroke="#333" stroke-width="1.5"/>
  <rect x="295" y="382" width="110" height="16" rx="4" fill="#FFF3E0" stroke="#FF9800"/>
  <text x="350" y="395" text-anchor="middle" font-size="8" fill="#E65100">CHOICE (8)</text>
  <line x1="350" y1="398" x2="310" y2="430" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="398" x2="390" y2="430" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CHOICE branches -->
  <circle cx="310" cy="447" r="17" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="310" y="452" text-anchor="middle" fill="white" font-size="10" font-weight="bold">10a</text>
  <circle cx="390" cy="447" r="17" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="390" y="452" text-anchor="middle" fill="white" font-size="10" font-weight="bold">10b</text>

  <!-- RIGHT: expedition route (2 battles) -->
  <line x1="350" y1="205" x2="640" y2="245" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="223" text-anchor="middle" font-size="8" fill="#D32F2F">exped</text>
  <circle cx="640" cy="263" r="17" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="640" y="268" text-anchor="middle" fill="white" font-size="10" font-weight="bold">11</text>
  <line x1="640" y1="280" x2="640" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="640" cy="337" r="17" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="640" y="342" text-anchor="middle" fill="white" font-size="10" font-weight="bold">12</text>
  <text x="640" y="365" text-anchor="middle" font-size="8" fill="#777">(end)</text>
  <text x="640" y="378" text-anchor="middle" font-size="8" fill="#777">Expedition</text>
  <text x="640" y="391" text-anchor="middle" font-size="8" fill="#777">S→Success</text>
  <text x="640" y="404" text-anchor="middle" font-size="8" fill="#777">A/B→Partial</text>

  <!-- Sub + center converge -->
  <line x1="50" y1="428" x2="200" y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="310" y1="464" x2="200" y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="390" y1="464" x2="200" y2="500" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="485" text-anchor="middle" font-size="8" fill="#555">converge</text>

  <rect x="120" y="492" width="160" height="20" rx="4" fill="#E8F5E9" stroke="#4CAF50"/>
  <text x="200" y="507" text-anchor="middle" font-size="9" fill="#2E7D32">shared junction</text>

  <circle cx="200" cy="527" r="20" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="200" y="532" text-anchor="middle" fill="white" font-size="11" font-weight="bold">5</text>

  <line x1="200" y1="547" x2="200" y2="585" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="200" cy="605" r="20" fill="#F44336" stroke="#333" stroke-width="3"/>
  <text x="200" y="610" text-anchor="middle" fill="white" font-size="11" font-weight="bold">BOSS</text>
  <text x="200" y="638" text-anchor="middle" font-size="8" fill="#777">Sortie Success</text>

  <!-- Legend -->
  <rect x="10" y="10" width="155" height="95" fill="#f9f9f9" stroke="#ccc"/>
  <circle cx="25" cy="25" r="8" fill="#4CAF50"/><text x="40" y="29" font-size="10">START</text>
  <circle cx="25" cy="40" r="8" fill="#FF9800"/><text x="40" y="44" font-size="10">NORMAL</text>
  <circle cx="25" cy="55" r="8" fill="#F44336"/><text x="40" y="59" font-size="10">BOSS (end)</text>
  <circle cx="25" cy="70" r="8" fill="#9C27B0"/><text x="40" y="74" font-size="10">NORMAL (sub)</text>
  <rect x="15" y="80" width="20" height="12" rx="2" fill="#FFF3E0" stroke="#FF9800"/>
  <text x="40" y="91" font-size="10">CHOICE</text>
  <rect x="15" y="95" width="20" height="12" rx="2" fill="#E8F5E9" stroke="#4CAF50"/>
  <text x="40" y="106" font-size="10">converge</text>
</svg>
