<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" font-family="monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold">Pattern N — Network (diverge → converge → diverge)</text>

  <!-- START -->
  <circle cx="340" cy="60" r="20" fill="#4CAF50" stroke="#333" stroke-width="2"/>
  <text x="340" y="65" text-anchor="middle" fill="white" font-size="11" font-weight="bold">1</text>
  <text x="340" y="95" text-anchor="middle" font-size="10">START</text>

  <line x1="340" y1="80" x2="340" y2="118" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NORMAL 2 -->
  <circle cx="340" cy="138" r="20" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="340" y="143" text-anchor="middle" fill="white" font-size="11" font-weight="bold">2</text>
  <text x="340" y="170" text-anchor="middle" font-size="10">NORMAL</text>

  <!-- Branch 1: diverge -->
  <line x1="340" y1="158" x2="340" y2="195" stroke="#333" stroke-width="2"/>
  <rect x="230" y="192" width="220" height="18" rx="4" fill="#E3F2FD" stroke="#2196F3"/>
  <text x="340" y="206" text-anchor="middle" font-size="9" fill="#1565C0">branch: capital ≤ 0.3? (sub route)</text>

  <!-- LEFT: sub route -->
  <line x1="340" y1="210" x2="90" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="228" text-anchor="middle" font-size="9" fill="#388E3C">Y</text>

  <circle cx="90" cy="268" r="20" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <text x="90" y="273" text-anchor="middle" fill="white" font-size="11" font-weight="bold">6</text>
  <text x="90" y="300" text-anchor="middle" font-size="10">NORMAL</text>
  <text x="90" y="314" text-anchor="middle" font-size="8" fill="#7B1FA2">(sub route)</text>

  <!-- RIGHT: surface route -->
  <line x1="340" y1="210" x2="590" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="228" text-anchor="middle" font-size="9" fill="#D32F2F">N</text>

  <circle cx="590" cy="268" r="20" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="590" y="273" text-anchor="middle" fill="white" font-size="11" font-weight="bold">3</text>
  <text x="590" y="300" text-anchor="middle" font-size="10">NORMAL</text>

  <!-- CONVERGENCE: both routes meet at NORMAL 7 -->
  <line x1="90" y1="288" x2="340" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="288" x2="340" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="335" text-anchor="middle" font-size="9" fill="#555">↘ converge ↙</text>

  <rect x="250" y="365" width="180" height="20" rx="4" fill="#E8F5E9" stroke="#4CAF50"/>
  <text x="340" y="380" text-anchor="middle" font-size="9" fill="#2E7D32">shared junction node</text>

  <circle cx="340" cy="400" r="20" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="340" y="405" text-anchor="middle" fill="white" font-size="11" font-weight="bold">7</text>
  <text x="340" y="435" text-anchor="middle" font-size="10">NORMAL</text>

  <!-- Branch 2: diverge again -->
  <line x1="340" y1="420" x2="340" y2="455" stroke="#333" stroke-width="2"/>
  <rect x="240" y="452" width="200" height="18" rx="4" fill="#E3F2FD" stroke="#2196F3"/>
  <text x="340" y="466" text-anchor="middle" font-size="9" fill="#1565C0">branch: screens ≥ 0.4?</text>

  <!-- LEFT of branch 2: boss -->
  <line x1="340" y1="470" x2="200" y2="505" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="265" y="485" text-anchor="middle" font-size="9" fill="#388E3C">Y</text>

  <circle cx="200" cy="525" r="20" fill="#F44336" stroke="#333" stroke-width="3"/>
  <text x="200" y="530" text-anchor="middle" fill="white" font-size="11" font-weight="bold">4</text>
  <text x="200" y="560" text-anchor="middle" font-size="10">BOSS (end)</text>
  <text x="200" y="574" text-anchor="middle" font-size="8" fill="#777">Sortie Success</text>

  <!-- CENTER of branch 2: expedition via CHOICE -->
  <line x1="340" y1="470" x2="340" y2="505" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="493" text-anchor="middle" font-size="9" fill="#F57C00">else</text>

  <circle cx="340" cy="525" r="20" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="340" y="530" text-anchor="middle" fill="white" font-size="11" font-weight="bold">8</text>
  <text x="340" y="560" text-anchor="middle" font-size="10">NORMAL</text>

  <line x1="340" y1="545" x2="340" y2="575" stroke="#333" stroke-width="2"/>
  <rect x="290" y="572" width="100" height="18" rx="4" fill="#FFF3E0" stroke="#FF9800"/>
  <text x="340" y="586" text-anchor="middle" font-size="9" fill="#E65100">CHOICE</text>

  <line x1="340" y1="590" x2="280" y2="610" stroke="#333" stroke-width="1.5"/>
  <line x1="340" y1="590" x2="400" y2="610" stroke="#333" stroke-width="1.5"/>
  <text x="310" y="608" text-anchor="middle" font-size="8" fill="#777">exped</text>
  <text x="370" y="608" text-anchor="middle" font-size="8" fill="#777">boss</text>

  <!-- Legend -->
  <rect x="10" y="10" width="155" height="95" fill="#f9f9f9" stroke="#ccc"/>
  <circle cx="25" cy="25" r="8" fill="#4CAF50"/><text x="40" y="29" font-size="10">START</text>
  <circle cx="25" cy="40" r="8" fill="#FF9800"/><text x="40" y="44" font-size="10">NORMAL</text>
  <circle cx="25" cy="55" r="8" fill="#F44336"/><text x="40" y="59" font-size="10">BOSS (end)</text>
  <circle cx="25" cy="70" r="8" fill="#9C27B0"/><text x="40" y="74" font-size="10">NORMAL (sub)</text>
  <rect x="15" y="80" width="20" height="12" rx="2" fill="#FFF3E0" stroke="#FF9800"/>
  <text x="40" y="91" font-size="10">CHOICE</text>
  <rect x="15" y="95" width="20" height="12" rx="2" fill="#E8F5E9" stroke="#4CAF50"/>
  <text x="40" y="106" font-size="10">converge</text>
</svg>
